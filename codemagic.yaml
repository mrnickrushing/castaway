# Codemagic: Last Tide for iOS.
#
# The App Store Connect API key comes from the Codemagic variable group `ios_credentials` (APP_STORE_CONNECT_PRIVATE_KEY,
# APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID), as in the team's other apps; nothing secret lives in
# this repository. The app record (bundle id com.rushingtech.lasttide) already exists in App Store Connect;
# its numeric Apple ID is looked up from the bundle id whenever it's needed.
#
#   asc-lookup      read only: prints the app's Apple ID, name, SKU and the in-app purchases already created.
#   ios-testflight  downloads the Xcode project exported by Tools/ios-export.sh (the `ios-latest` release asset),
#                   archives it, signs it with an App Store profile Xcode creates through
#                   the key, and uploads to TestFlight. Run it only when a TestFlight build is wanted.

workflows:
  asc-lookup:
    name: App Store Connect lookup
    max_build_duration: 10
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: com.rushingtech.lasttide
    scripts:
      - name: App record
        script: |
          set -euo pipefail
          for v in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID; do
            [ -n "${!v:-}" ] || { echo "Missing $v (variable group ios_credentials)"; exit 1; }
          done
          app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json > /tmp/apps.json
          python3 - <<'PY'
          import json
          apps = json.load(open("/tmp/apps.json"))
          if not apps:
              raise SystemExit("No App Store Connect app with this bundle id")
          a = apps[0]
          at = a.get("attributes", {})
          print("APPLE_ID", a["id"])
          for k in ("name", "bundleId", "sku", "primaryLocale"):
              print(k, at.get(k))
          open("/tmp/app_id", "w").write(a["id"])
          PY
      - name: In-app purchases already created
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          import jwt  # PyJWT, installed with codemagic-cli-tools
          key = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].replace("\\n", "\n")
          token = jwt.encode({"iss": os.environ["APP_STORE_CONNECT_ISSUER_ID"], "iat": int(time.time()),
                              "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256",
                             headers={"kid": os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"]})
          app = open("/tmp/app_id").read().strip()
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps/%s/inAppPurchasesV2?limit=200" % app,
                                       headers={"Authorization": "Bearer " + token})
          items = json.load(urllib.request.urlopen(req))["data"]
          print("IAP_COUNT", len(items))
          for i in items:
              at = i["attributes"]
              print("IAP", i["id"], at.get("productId"), at.get("inAppPurchaseType"), at.get("state"))
          PY

  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: com.rushingtech.lasttide
        APPLE_TEAM_ID: PH4AKDQ4Q7
        XCODE_PROJECT: ios/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
      xcode: latest
    scripts:
      - name: Download the exported Xcode project
        script: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ios-xcode.zip "https://github.com/mrnickrushing/castaway/releases/download/ios-latest/ios-xcode.zip"
          rm -rf ios && unzip -q /tmp/ios-xcode.zip -d .
      - name: Build number after the latest one on App Store Connect
        script: |
          set -euo pipefail
          APP_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" --all-versions 2>/dev/null || echo 0)
          echo "Apple ID $APP_ID, latest TestFlight build $LATEST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $((LATEST + 1))" ios/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/Info.plist
      - name: Archive and export a signed .ipa
        script: |
          set -euo pipefail
          KEY="/tmp/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          printf "%b" "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY"
                -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath /tmp/LastTide.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "${AUTH[@]}" archive > /tmp/xcodebuild_archive.log 2>&1 \
            || { grep -E "error:|error -|Error Domain|No profiles|No signing|failed" /tmp/xcodebuild_archive.log | sort -u | tail -40; exit 1; }
          cat > /tmp/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key><string>automatic</string>
              <key>destination</key><string>export</string>
            </dict>
          </plist>
          PLIST
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath /tmp/LastTide.xcarchive -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/export_options.plist "${AUTH[@]}" > /tmp/xcodebuild_export.log 2>&1 \
            || { grep -E "error|Error" /tmp/xcodebuild_export.log | tail -30; exit 1; }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/LastTide.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
